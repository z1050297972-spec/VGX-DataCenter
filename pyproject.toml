[project]
name = "rdp"
# uv_build 不支持动态版本，按本票 A1 要求使用静态版本。
version = "0.1.0"
description = "机器人数据管理平台"
# ADR 0002 固定 Python 3.12，避免开发、检查和运行时使用不同的次版本。
requires-python = "==3.12.*"
# A1 只提供最小包；后续依赖由 Claude 用 uv add 写入。
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.161.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
rdp = "rdp.cli:main"

[build-system]
# 工单 D1 已批准 uv_build：与 uv 同源，仅用于构建，支持本包的 editable 安装。
# 按派工指定的 uv 0.13.5 设置下限；上限将构建后端限定在 0.13 系列。
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "pytest-testmon>=2.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
# 03 号决策票：格式化行宽 100 个字符，所有后端源码、脚本和测试共用。
line-length = 100
include = ["src/**/*.py", "scripts/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
# DOC 仍处于 preview；只启用逐条点名的预览规则，不随升级引入整组预览规则。
preview = true
explicit-preview-rules = true
select = [
    "E4", "E7", "E9", "F", # Ruff 默认规则。
    "B", "UP", "I", "N", "PTH", "SIM", "D", # 03 号票要求的代码及文档规范。
    "T20", "DTZ", "S", "ERA001", # 禁止 print、无时区时间及危险写法；E722 已禁止裸 except。
    "C901", "PLR0912", "PLR0913", "PLR0915", # 复杂度、分支、参数、语句阈值。
    "RUF001", "RUF002", "RUF003", "RUF100", # 检查混淆字符和多余豁免。
    "PGH003", "PGH004", # 禁止没有规则码的 type: ignore 和 noqa。
    "DOC102", "DOC201", "DOC402", "DOC403", "DOC501",
]
ignore = [
    "D400", # 0.17.1 实测仍要求英文句点，不接受中文句号；遵循规则 5。
    "D415", # 0.17.1 实测仍不接受中文句号；中文文档不添加多余的英文标点。
]
# 0.17.1 实测 RUF001–003 会报中文冒号、括号、逗号和分号；保留检查并允许中文标点。
allowed-confusables = ["：", "（", "）", "，", "；", "。", "！", "？", "【", "】", "“", "”", "‘", "’", "、", "…", "—"]
# DOC102 核对多写的参数，D417 核对缺少的参数说明；DOC201/402/403/501 核对返回、生成和异常。
# 不启用 DOC202：0.17.1 会拒绝无显式 return 的函数写 Returns: 无（规则 4 要求保留）。
# 不启用 DOC502：0.17.1 会把 Raises: 无 误当异常，也会拒绝记录有意穿过的下层异常。
# 0.17.1 实测上述已启用的 DOC 规则兼容 raise NotImplementedError 骨架。
# 六项完整性、顺序和非空检查由契约脚本补齐，并纳入 make check。

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# 私有函数和 property 按规范只需一句职责，不强加公开函数的小节要求。
ignore-one-line-docstrings = true

[tool.ruff.lint.mccabe]
# 03 号票：每个函数的圈复杂度不超过 10。
max-complexity = 10

[tool.ruff.lint.pylint]
# 03 号票：每个函数最多 5 个参数、40 条语句、12 个分支。
max-args = 5
max-statements = 40
max-branches = 12

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101", # pytest 用 assert 表达期望，测试断言不承担生产输入校验。
    "D417", # 测试的 docstring 记录契约行为，不要求为 fixture 参数重复写 Args。
]

[tool.basedpyright]
include = ["src/rdp", "scripts", "tests"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
# 骨架关卡 G3：warning 也阻止交付，避免严格模式中的警告被忽略。
failOnWarnings = true
# 显式绑定项目解释器，避免使用 PATH 上 miniconda 的 Python 3.14。
venvPath = "."
venv = ".venv"
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
# 规范 8.1 只允许带规则名的 pyright: ignore，type: ignore 不参与抑制。
enableTypeIgnoreComments = false

[tool.importlinter]
root_package = "rdp"
# ADR 0001：同时检查第三方 Web 框架，防止基础层绕过入口层。
include_external_packages = true

[[tool.importlinter.contracts]]
name = "入口层经领域层向下依赖基础层"
type = "layers"
layers = [
    # 两个入口互不依赖，避免 Web 入口与运维入口之间耦合。
    "rdp.api | rdp.ops",
    # M0 第 8 张：作业提交/取消写操作日志，并在同事务重验账号身份、查历史账号存在性。
    # jobs 可依赖 accounts/audit；账号和日志不得反向依赖 jobs，避免请求上下文循环。
    "rdp.jobs",
    # M3：机器人与采集词表登记（数据库对象）。数据集的采集信息校验和索引要引用它，所以在 jobs 之下；
    # 它记创建人和操作日志，所以在 accounts、audit 之上。
    # M4-03 转换作业读取工具登记，允许 jobs 依赖 tools；tools 不得反向依赖 jobs 或入口层。
    # collection 与 tools 互不依赖，作为同层独立兄弟。
    "rdp.collection | rdp.tools",
    "rdp.accounts",
    "rdp.audit",
    "rdp.infra",
]

[[tool.importlinter.contracts]]
name = "基础层不得依赖 Web 框架"
type = "forbidden"
source_modules = [
    "rdp.infra",
    # M0 工单 04：作业结果必须可脱离入口调用，领域层同样禁用 Web 框架（规范 1.3）。
    "rdp.jobs",
    # M4-01：工具登记与程序指纹是领域逻辑，不得依赖 Web 框架。
    "rdp.tools",
    # M0 工单 06：账号领域不依赖 Web 框架，禁止反向依赖 jobs。
    "rdp.accounts",
    # M0 第 7 张：日志可由运维和未来 worker 调用，不依赖 Web 框架。
    "rdp.audit",
    # M3：机器人与采集词表登记同属领域层。
    "rdp.collection",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]

# M0 工单 06 前置：日志和编号规则须独立于数据库包（负责人 2026-10-25 批准挪出，本合同由执行线加）。
[[tool.importlinter.contracts]]
name = "基础层的日志不得依赖数据库包"
type = "forbidden"
source_modules = ["rdp.infra.logging", "rdp.infra.ids"]
forbidden_modules = ["rdp.infra.db"]

# M1-07 / 规范 1.4 / ADR 0005：Web 进程不写导航层。写导航层的三个模块（原子写、中断恢复、写入流水线）
# 只能由 worker 一侧 import；rdp.api 和 rdp.ops 不得直接依赖它们。
# 刻意用 allow_indirect_imports=true：rdp.jobs.registry.production_registry 在函数内同时给 Web 和 worker
# 登记同一批作业类型（Web 只为校验提交参数），这条间接链是设计内的；Web 拿不到写入能力，
# 因为 NavWriteDependencies 只由 worker 构造，Web 侧登记传 None，执行时缺依赖即程序缺陷。
# 直接依赖由本合约保证；"Web 侧没有真的写"由测试（只读状态、假导航层未变）保证，不冒充 I/O 沙箱。
[[tool.importlinter.contracts]]
name = "写导航层的模块只能被 worker 一侧 import"
type = "forbidden"
source_modules = ["rdp.api", "rdp.ops"]
forbidden_modules = [
    "rdp.jobs.navwrite.atomic",
    "rdp.jobs.navwrite.recovery",
    "rdp.jobs.navwrite.pipeline",
    "rdp.jobs.navwrite.jobs",
    # M1.5-02：编辑预览仅在 worker 执行，Web 只能导入参数和只读表单/确认服务。
    "rdp.jobs.navwrite.field_jobs",
]
allow_indirect_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
# 03 号票不设覆盖率门槛；保留跳过原因输出，防止环境阻塞被误当作通过。
# CODING_STANDARDS 7.8 要求失败时先保留证据；成功样例清理，失败现场保留供定位。
tmp_path_retention_policy = "failed"

# M1-03关卡决定 / ADR 0006：允许复用导航reading和fingerprint，禁止存储访问及作业执行能力。
# M1.5-01：独立file_viewer可带超时只读存储根，其余查询不能经查看器绕过本禁入契约。
# 查询与schema检查全部间接依赖；提交模块经M0服务插作业行，由不可读假根测试验证运行边界。
# 实际调用及路径不跟随链接的边界由不可读假存储根和换链测试验证，不以此合约冒充I/O沙箱。
[[tool.importlinter.contracts]]
name = "数据集接口不得依赖存储根访问"
type = "forbidden"
source_modules = ["rdp.jobs.dataset_browser.queries", "rdp.jobs.dataset_browser.schemas"]
forbidden_modules = [
    "rdp.jobs.file_viewer",
    "rdp.jobs.storage",
    "rdp.infra.storage",
    "rdp.jobs.execution",
    "rdp.jobs.worker",
    "rdp.jobs.registry",
    "rdp.api.storage",
]
allow_indirect_imports = false
