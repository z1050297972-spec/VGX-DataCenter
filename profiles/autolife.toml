# 目标取法和频率待补测，见规划票 18；String 没有 header，依 ADR 0007 用接收时刻。
target = { topic = "/topic_arm_whole_body_target_joints_position_0_310", message_type = "std_msgs/msg/String", stamp = "receive", stamp_trusted = false, may_be_silent = true }

