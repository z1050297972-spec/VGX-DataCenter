[[camera]]
name = "head"
encoding = "bgr8"
# 没有 ROS 图像话题；具体 SHM 来源、分辨率、帧率、时间戳、触发方式待补测，见规划票 18。
# 0007 已确认多个缓冲区，不能把草样的 head 擅自对应到其中一个。
